<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#142333">
  <meta name="application-name" content="VerSans Admin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VerSans Admin">
  <link rel="manifest" href="/admin-manifest.webmanifest?v=20260930-admin-push-v1">
  <link rel="canonical" href="https://versans.com/admin">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <title>VerSans Admin</title>
  <link rel="stylesheet" href="/assets/fonts.css?v=20260930-admin-font-v1">
  <link rel="stylesheet" href="/assets/admin.css?v=20261004-order-work-v53">
</head>
<body class="admin-body">
  <script>
    // Keep the installed app anchored to /admin instead of the site root or legacy admin URLs.
    if (window.location.pathname === "/admin.html" || window.location.pathname === "/admin/dashboard") {
      window.history.replaceState(null, "", "/admin" + window.location.search + window.location.hash);
    }
  </script>
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar" aria-label="ניווט אדמין">
      <div class="admin-sidebar__top">
        <a class="admin-brand" href="/admin/dashboard" aria-label="VerSans Admin">
          <span class="admin-brand__mark">VS</span>
          <span class="admin-brand__text"><strong>VerSans</strong><small>ADMIN PANEL</small></span>
        </a>
        <button class="admin-sidebar__close" id="adminSidebarClose" type="button" aria-label="סגירת תפריט">×</button>
      </div>

      <nav class="admin-nav">
        <a href="/admin/dashboard" data-admin-page="dashboard"><span class="admin-nav__icon">⌂</span><span>Dashboard</span></a>
        <a href="/admin/visitors" data-admin-page="visitors"><span class="admin-nav__icon">◎</span><span>מבקרים</span></a>
        <a href="/admin/sales" data-admin-page="sales"><span class="admin-nav__icon">₪</span><span>מכירות</span></a>
        <a href="/admin/orders" data-admin-page="orders"><span class="admin-nav__icon">▤</span><span>הזמנות</span></a>
        <a href="/admin/order-work" data-admin-page="order-work"><span class="admin-nav__icon">✓</span><span>טיפול בהזמנות</span></a>
        <a href="/admin/products" data-admin-page="products"><span class="admin-nav__icon">◇</span><span>מוצרים</span></a>
        <a href="/admin/customers" data-admin-page="customers"><span class="admin-nav__icon">♙</span><span>לקוחות</span></a>
        <a href="/admin/reviews" data-admin-page="reviews"><span class="admin-nav__icon">★</span><span>ביקורות</span></a>
      </nav>

      <div class="admin-sidebar__footer">
        <p>VerSans Analytics</p>
        <span>ניהול, טיפול וניתוח</span>
        <a href="/">חזרה לאתר ↗</a>
      </div>
    </aside>

    <div class="admin-sidebar-backdrop" id="adminSidebarBackdrop" hidden></div>

    <section class="admin-workspace">
      <header class="admin-header">
        <div class="admin-header__left">
          <button class="admin-mobile-nav" id="adminMobileNav" type="button" aria-label="פתיחת ניווט" aria-controls="adminSidebar" aria-expanded="false">☰</button>
          <div>
            <p class="admin-header__eyebrow">VERSANS ANALYTICS</p>
            <h1 id="adminPageTitle">Dashboard</h1>
            <p id="adminPageSubtitle">טוען נתונים…</p>
          </div>
        </div>
        <div class="admin-header__actions">
          <span class="admin-live"><i></i>LIVE</span>
          <button class="admin-push-button" id="adminPushToggle" type="button" hidden aria-live="polite">🔔 הפעל התראות</button>
          <button class="admin-icon-button" id="adminRefresh" type="button" title="רענון">↻</button>
          <a class="admin-site-link" href="/">לאתר</a>
        </div>
      </header>

      <main class="admin-main">
        <div id="adminContent" class="admin-content" aria-live="polite">
          <div class="admin-page-loading"><span></span><p>טוען את נתוני הניהול…</p></div>
        </div>
      </main>
    </section>
  </div>

  <div class="admin-toast" id="adminToast" role="status" aria-live="polite" hidden></div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async function () {
        try {
          const registration = await navigator.serviceWorker.register("/admin-sw.js?v=20260930-bilingual-v9", {
            scope: "/",
            updateViaCache: "none"
          });

          // Force Safari/iPhone to refresh an already-installed VerSans worker.
          try { await registration.update(); } catch (_) {}

          if (registration.waiting) {
            registration.waiting.postMessage({ type: "SKIP_WAITING" });
          }

          if (registration.installing) {
            registration.installing.addEventListener("statechange", function () {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: "SKIP_WAITING" });
              }
            });
          }
        } catch (error) {
          console.warn("VerSans Admin service worker registration failed:", error);
        }
      });
    }
  </script>
  <script src="/assets/admin.js?v=20261004-order-work-v54"></script>
</body>
</html>
