<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>ביטול עסקה / החזרה | VerSans</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/auth.css"><link rel="stylesheet" href="/assets/fonts.css"><style>.request-shell{max-width:720px;margin:6vh auto;padding:20px}.request-card{background:#fff;border:1px solid #e2e7ea;border-radius:18px;padding:clamp(20px,5vw,42px)}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.request-grid .wide{grid-column:1/-1}.request-card label{display:grid;gap:6px}.request-card input,.request-card select,.request-card textarea{min-height:46px;padding:10px;border:1px solid #cfd7dc;border-radius:9px;font:inherit}.request-card textarea{min-height:120px}.request-help{line-height:1.8;color:#5d6870}@media(max-width:620px){.request-grid{grid-template-columns:1fr}}</style></head><body><main class="request-shell"><p><a href="/shop#shop">← חזרה לחנות</a></p><section class="request-card"><p class="auth-card__eyebrow">VERSANS</p><h1>בקשת ביטול / החזרה</h1><p class="request-help">הטופס שולח בקשה אמיתית למערכת VerSans. אפשר לפנות גם ב<a href="mailto:versanssupport@gmail.com">אימייל</a>, <a href="tel:+972553026389">בטלפון</a> או ב<a href="https://wa.me/972553026389" target="_blank" rel="noopener">WhatsApp</a>. מספר השירות: <b dir="ltr">055-302-6389</b>. שעות שירות: 08:00–22:00 בכל יום.</p><form id="cancelOrderForm" class="request-grid"><label>סוג בקשה<select name="requestType" required><option value="cancel">ביטול עסקה</option><option value="return">החזרה</option></select></label><label>מספר הזמנה VerSans<input name="orderRef" id="cancelOrderRef" required maxlength="80" autocomplete="off"></label><label>שם מלא<input name="name" required maxlength="100" autocomplete="name"></label><label>אימייל של ההזמנה<input name="email" type="email" required autocomplete="email"></label><label>טלפון<input name="phone" type="tel" required autocomplete="tel"></label><label class="wide">פירוט הבקשה<textarea name="reason" maxlength="1200" placeholder="אפשר לציין סיבה או פרטים שיעזרו לנו לטפל בבקשה"></textarea></label><label class="wide"><input name="confirm" type="checkbox" required> אני מאשר/ת שהפרטים נמסרו לצורך טיפול בבקשה.</label><div class="wide" id="cancelOrderMessage" role="status" aria-live="polite"></div><button class="btn btn--primary wide" type="submit">שליחת הבקשה</button></form><p class="request-help">הגשת הבקשה אינה גורעת מזכויות לפי דין. <a href="/policies#cancel">למדיניות הביטול המלאה</a>.</p></section></main><script src="/assets/request-forms.js?v=20260926-compliance-v1"></script></body></html>
