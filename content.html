<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>VerSans</title>
  <link rel="stylesheet" href="/assets/content.css?v=20261016-creator-commission-v1">
  <script defer src="/assets/content.js?v=20261016-creator-commission-v1"></script>
</head>
<body>
  <div class="cc-layout">
    <header class="cc-header">
      <div class="cc-brand" aria-label="VerSans Creator Program">
        <img src="/images/VersansLogoWordmarkWhite.png" width="719" height="171" alt="VerSans">
        <span class="cc-brand-divider" aria-hidden="true"></span>
        <span class="cc-brand-program">CREATORS</span>
      </div>
      <span class="cc-private"><span class="cc-status-dot" aria-hidden="true"></span> אזור אישי ליוצרי תוכן</span>
    </header>
    <main>
      <div class="cc-intro">
        <p class="cc-eyebrow">VERSANS / CREATOR PROGRAM</p>
        <p id="pageSubtitle">נתונים מדויקים על רכישות שבוצעו באמצעות קוד היוצר שלך.</p>
      </div>
      <div class="cc-toolbar">
        <nav class="cc-tabs" aria-label="ניווט ליוצרי תוכן">
          <a href="/creators/dashboard" id="tabDashboard">Dashboard</a>
          <a href="/creators/leaderboard" id="tabLeaderboard">Leaderboard</a>
        </nav>
        <section class="cc-range" aria-label="סינון לפי תקופה">
          <span class="cc-range-label">הצג נתונים עבור</span>
          <div class="cc-range-options" id="rangeOptions" role="group" aria-label="בחירת תקופת הדוח">
            <button type="button" data-range="all">כל הזמנים</button>
            <button type="button" data-range="year">שנה</button>
            <button type="button" data-range="6months">6 חודשים</button>
            <button type="button" data-range="3months">3 חודשים</button>
            <button type="button" data-range="month">חודש</button>
            <button type="button" data-range="week">שבוע</button>
            <button type="button" data-range="3days">3 ימים</button>
            <button type="button" data-range="today">היום</button>
          </div>
        </section>
      </div>
      <div class="cc-error" id="error" role="alert" hidden></div>
      <div id="app" aria-live="polite"><div class="cc-loading">טוענים את הנתונים שלך...</div></div>
    </main>
    <footer class="cc-footer"><span>© VerSans Creator Program</span><span>נתוני המכירות מחושבים לפי הזמנות ששולמו בלבד</span></footer>
  </div>
</body>
</html>
