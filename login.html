<style id="versans-guest-orders-login-v39">
  .guest-orders-entry{
    display:none;
    margin:0 0 1rem;
  }
  .guest-orders-entry.is-visible{
    display:block;
  }
  .guest-orders-entry__btn{
    width:100%;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.45rem;
    text-decoration:none;
  }
  .guest-orders-entry__name{
    display:block;
    margin-top:.38rem;
    text-align:center;
    color:#66727b;
    font-size:.76rem;
  }
</style>

</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-shell">
  <section class="auth-visual" aria-hidden="true"><div class="auth-visual__media"><img src="images/auth-showcase.png" alt="" loading="eager" decoding="async"></div><div class="auth-visual__content"><p class="auth-visual__eyebrow">חשבון VERSANS</p><h1 id="authVisualTitle">המתנה שלכם. החשבון שלכם.</h1><p id="authVisualText">חשבון VerSans מאפשר לנו לזהות אתכם בצורה מאובטחת ולהוסיף בהמשך היסטוריית הזמנות, ביקורות והטבות.</p></div></section>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__top"><a class="auth-card__brand" href="/shop#top" aria-label="VerSans"><span class="brand__logo"><img src="images/VerSansLogoBlackJewlery.png" alt="VerSans" width="800" height="800"></span></a><div><a class="auth-back" id="authBack" href="/shop#shop">חזרה לחנות</a></div></div>
      <p class="auth-card__eyebrow">VERSANS</p><h2 id="authTitle">כניסה לחשבון</h2><p class="auth-card__lead" id="authLead">התחברו כדי לנהל את החשבון שלכם ב־VerSans.</p>
      <div class="guest-orders-entry" id="guestOrdersEntry">
        <a class="btn btn--ghost guest-orders-entry__btn" href="/my-orders">ההזמנות שלי</a>
        <span class="guest-orders-entry__name" id="guestOrdersName"></span>
      </div>
      <form class="auth-form" id="authForm" novalidate>
        <div class="auth-field"><label for="email">אימייל</label><input class="auth-input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254"></div>
        <div class="auth-field"><label for="password">סיסמה</label><div class="auth-password-wrap"><input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><button class="auth-password-toggle" type="button" data-password-toggle="password">הצג</button></div><div class="auth-field__actions"><a class="auth-forgot-link" id="forgotPasswordLink" href="/forgot-password">שכחתי סיסמה</a></div></div>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <button class="btn btn--primary auth-submit" id="authSubmit" type="submit"><span id="authSubmitText">התחברות</span></button>
      </form>
      <p class="auth-switch"><span id="switchPrefix">עדיין אין לכם חשבון?</span> <a id="switchLink" href="/register">צרו חשבון</a></p>
    </div>
  </section>
</main>
<script src="assets/auth.js?v=20261004-clean-admin-login-v50"></script>
  <script src="/assets/presence.js?v=20260915-presence-v1"></script>
<script src="assets/accessibility.js?v=20261005-ai-v2"></script>

<script id="versans-guest-orders-login-script-v41">
(function () {
  var entry = document.getElementById('guestOrdersEntry');
  var nameEl = document.getElementById('guestOrdersName');
  if (!entry) return;

  /* One check only. No timers, no polling, no reloads. */
  fetch('/api/auth/me', {
    credentials: 'same-origin',
    cache: 'no-store',
    headers: { Accept: 'application/json' }
  })
    .then(function (response) {
      return response.ok ? response.json() : null;
    })
    .then(function (data) {
      if (!data || data.user) return;
      var guest = data.guest || null;
      if (!guest || !guest.hasOrders) return;

      entry.classList.add('is-visible');
      if (nameEl) nameEl.textContent = guest.name || '';
    })
    .catch(function () {});
})();
</script>

</body>
</html>
