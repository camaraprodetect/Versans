<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>כניסה לחשבון - VerSans</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=20260908-promo-v3">
<link rel="stylesheet" href="assets/brand.css?v=20260905-versans-v1">
<link rel="stylesheet" href="assets/auth.css?v=20260905-auth-v6">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css?v=20260909-fonts-only">
<link rel="stylesheet" href="assets/typography-only.css?v=20260909-fonts-only">
</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-shell">
  <section class="auth-visual" aria-hidden="true"><div class="auth-visual__media"><img src="images/auth-showcase.png" alt="" loading="eager" decoding="async"></div><div class="auth-visual__content"><p class="auth-visual__eyebrow">VERSANS ACCOUNT</p><h1 id="authVisualTitle">המתנה שלכם. החשבון שלכם.</h1><p id="authVisualText">חשבון VerSans מאפשר לנו לזהות אתכם בצורה מאובטחת ולהוסיף בהמשך היסטוריית הזמנות, ביקורות והטבות.</p></div></section>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__top"><a class="auth-card__brand" href="/" aria-label="VerSans"><span class="brand__logo"><img src="images/VerSansLogoBlackJewlery.png" alt="VerSans" width="800" height="800"></span></a><div><a class="auth-back" id="authBack" href="/">חזרה לחנות</a></div></div>
      <p class="auth-card__eyebrow">VERSANS</p><h2 id="authTitle">כניסה לחשבון</h2><p class="auth-card__lead" id="authLead">התחברו כדי לנהל את החשבון שלכם ב־VerSans.</p>
      <form class="auth-form" id="authForm" novalidate>
        <div class="auth-field"><label for="email">אימייל</label><input class="auth-input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254"></div>
        <div class="auth-field"><label for="password">סיסמה</label><div class="auth-password-wrap"><input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><button class="auth-password-toggle" type="button" data-password-toggle="password">הצג</button></div></div>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <button class="btn btn--primary auth-submit" id="authSubmit" type="submit"><span id="authSubmitText">התחברות</span></button>
      </form>
      <p class="auth-switch"><span id="switchPrefix">עדיין אין לכם חשבון?</span> <a id="switchLink" href="/register">צרו חשבון</a></p>
    </div>
  </section>
</main>
<script src="assets/auth.js?v=20260914-pretty-urls-v1"></script>
</body>
</html>
