<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>בקשת פרטיות | VerSans</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/auth.css"><link rel="stylesheet" href="/assets/fonts.css"><style>.request-shell{max-width:720px;margin:6vh auto;padding:20px}.request-card{background:#fff;border:1px solid #e2e7ea;border-radius:18px;padding:clamp(20px,5vw,42px)}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.request-card label{display:grid;gap:6px}.request-card input,.request-card select,.request-card textarea{min-height:46px;padding:10px;border:1px solid #cfd7dc;border-radius:9px;font:inherit}.request-card textarea{min-height:110px}.request-help{line-height:1.8;color:#5d6870}@media(max-width:620px){.request-grid{grid-template-columns:1fr}}</style></head><body><main class="request-shell"><p><a href="/policies#privacy">← למדיניות הפרטיות</a></p><section class="request-card"><p class="auth-card__eyebrow">VERSANS PRIVACY</p><h1>בקשת עיון / תיקון מידע</h1><p class="request-help">לאחר קבלת הבקשה נבצע אימות זהות סביר לפני מסירת מידע אישי או שינויו.</p><form id="privacyRequestForm" class="request-grid"><label>סוג בקשה<select name="requestType" required><option value="access">עיון במידע</option><option value="correction">תיקון מידע</option></select></label><label>שם מלא<input name="name" required autocomplete="name"></label><label>אימייל<input name="email" type="email" required autocomplete="email"></label><label>טלפון<input name="phone" type="tel" required autocomplete="tel"></label><label class="wide">פרטים<textarea name="details" maxlength="1600" required></textarea></label><div class="wide" id="privacyRequestMessage" role="status" aria-live="polite"></div><button class="btn btn--primary wide" type="submit">שליחת הבקשה</button></form></section></main><script src="/assets/request-forms.js?v=20260926-compliance-v1"></script></body></html>
