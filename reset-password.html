<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>VerSans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=20260908-promo-v3">
<link rel="stylesheet" href="assets/brand.css?v=20260905-versans-v1">
<link rel="stylesheet" href="assets/auth.css?v=20260922-password-reset-v2">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css?v=20260909-fonts-only">
<link rel="stylesheet" href="assets/typography-only.css?v=20260909-fonts-only">
</head>
<body class="auth-page" data-auth-page="reset-password">
<main class="auth-shell">
  <section class="auth-visual" aria-hidden="true"><div class="auth-visual__media"><img src="images/auth-showcase.png" alt="" loading="eager" decoding="async"></div><div class="auth-visual__content"><p class="auth-visual__eyebrow">חשבון VERSANS</p><h1 id="authVisualTitle">המתנה שלכם. החשבון שלכם.</h1><p id="authVisualText">חשבון VerSans מאפשר לנו לזהות אתכם בצורה מאובטחת ולהוסיף בהמשך היסטוריית הזמנות, ביקורות והטבות.</p></div></section>
  <section class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__top"><a class="auth-card__brand" href="/shop#top" aria-label="VerSans"><span class="brand__logo"><img src="images/VerSansLogoBlackJewlery.png" alt="VerSans" width="800" height="800"></span></a><div><a class="auth-back" id="authBack" href="/shop#shop">חזרה לחנות</a></div></div>
      <p class="auth-card__eyebrow">VERSANS</p><h2 id="authTitle">שינוי סיסמה</h2><p class="auth-card__lead" id="authLead">הזינו סיסמה חדשה, אשרו אותה ולחצו על שינוי סיסמה.</p>
      <form class="auth-form" id="authForm" novalidate>
        <div class="auth-field"><label for="password">סיסמה חדשה</label><div class="auth-password-wrap"><input class="auth-input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="auth-password-toggle" type="button" data-password-toggle="password">הצג</button></div><p class="auth-password-hint" id="passwordHint">לפחות 8 תווים.</p></div>
        <div class="auth-field"><label for="confirmPassword">אימות סיסמה חדשה</label><div class="auth-password-wrap"><input class="auth-input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="auth-password-toggle" type="button" data-password-toggle="confirmPassword">הצג</button></div></div>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <button class="btn btn--primary auth-submit" id="authSubmit" type="submit" disabled><span id="authSubmitText">שינוי סיסמה</span></button>
      </form>
      <p class="auth-switch"><a id="switchLink" href="/login">חזרה להתחברות</a></p>
    </div>
  </section>
</main>
<script src="assets/auth.js?v=20260922-password-reset-hidden-token-v1"></script>
<script src="/assets/presence.js?v=20260915-presence-v1"></script>
</body>
</html>
