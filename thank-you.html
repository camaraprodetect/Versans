<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>VerSans</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&amp;family=Frank+Ruhl+Libre:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=20260923-product-orders-v5">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="assets/brand.css?v=20260905-versans-v1">
<link rel="stylesheet" href="assets/fonts.css?v=20260909-fonts-only">
<link rel="stylesheet" href="assets/typography-only.css?v=20260909-fonts-only">
</head>
<body>

<header class="nav">
  <div class="nav__inner container">
    <a class="brand" href="/shop#top">
      <span class="brand__logo"><img src="images/VerSansLogoBlackJewlery.png" alt="VerSans" width="800" height="800" decoding="async"></span><span class="brand__sr" data-brand aria-hidden="true" dir="ltr">VerSans</span>
    </a>
    <div class="nav__actions">
    </div>
  </div>
</header>

<main class="container">
  <div class="result" id="result">
    <div class="spinner"></div>
    <p style="margin-top:1.2rem" id="checkingText">בודקים את התשלום…</p>
  </div>
</main>

<footer class="foot">
  <div class="container">
    <div class="foot__bottom" style="margin-top:0;border:0">
      <span>© <span id="year"></span> <span data-brand></span></span>
      <span><a href="/policies#terms">תקנון</a></span>
      <span><a href="/policies#cancel-request">ביטול עסקה</a></span>
    </div>
  </div>
</footer>

<script src="assets/config.js?v=20260924-whatsapp-restore-v1"></script>
<script src="assets/i18n.js?v=20260922-order-confirmation-v1"></script>
<script>
(function () {
  'use strict';
  var lang = 'he';
  var dict = I18N.he;
  function t(k) { return dict[k] || I18N.he[k] || k; }

  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';
  document.title = t('ty.ok.t') + ' - ' + STORE_CONFIG.brand.name.he;
  document.getElementById('checkingText').textContent = t('ty.checking');
  document.getElementById('year').textContent = new Date().getFullYear();
  Array.prototype.forEach.call(document.querySelectorAll('[data-brand]'), function (el) {
    el.textContent = STORE_CONFIG.brand.name[lang] || STORE_CONFIG.brand.name.he;
  });

  var params = new URLSearchParams(window.location.search);
  var pending = null;
  try { pending = JSON.parse(localStorage.getItem('kw_pending') || 'null'); } catch (e) {}

  var okIcon = '<svg class="result__icon" viewBox="0 0 48 48" fill="none" stroke="#2F6B4F" stroke-width="2"><circle cx="24" cy="24" r="21"/><path d="M15 24.5l6.5 6.5L33 18"/></svg>';
  var noIcon = '<svg class="result__icon" viewBox="0 0 48 48" fill="none" stroke="#A32B22" stroke-width="2"><circle cx="24" cy="24" r="21"/><path d="M17 17l14 14M31 17L17 31"/></svg>';

  function productOrderRef(orderId, index) {
    return String(orderId || '') + '-P' + String(index + 1).padStart(2, '0');
  }

  function itemOrdersHtml(orderId) {
    var rows = pending && Array.isArray(pending.itemOrders) ? pending.itemOrders : [];
    if (!orderId || !rows.length) return '';
    return '<div class="result__item-orders"><div class="result__item-orders-title">מספרי ההזמנה לפי מוצר</div>' + rows.map(function (item, index) {
      return '<div class="result__item-order"><div><strong>' + String(item.name || 'מוצר').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }) + '</strong>' + (Number(item.qty || 1) > 1 ? '<small>כמות ' + Number(item.qty || 1) + '</small>' : '') + '</div><code>' + productOrderRef(orderId, index) + '</code></div>';
    }).join('') + '<p>שמרו את המספר של כל מוצר. בעמוד המעקב תוכלו לבדוק כל מוצר בנפרד.</p></div>';
  }

  function show(ok, orderId) {
    var html = (ok ? okIcon : noIcon) +
      '<h1>' + (ok ? t('ty.ok.t') : t('ty.fail.t')) + '</h1>' +
      '<p>' + (ok ? t('ty.ok.d') : t('ty.fail.d')) + '</p>' +
      (ok && orderId ? itemOrdersHtml(orderId) : '') +
      '<p class="result__cta"><a class="btn btn--primary" href="/shop#shop">' + t('ty.home') + '</a></p>';
    document.getElementById('result').innerHTML = html;
    if (ok) {
      try { localStorage.removeItem('kw_cart'); localStorage.removeItem('kw_pending'); } catch (e) {}
    }
  }

  var orderId = params.get('Order') || (pending && pending.order) || '';

  // אין פרמטרים בכלל – הגעה ישירה לעמוד
  if (!params.toString()) { show(false, ''); return; }

  fetch('/api/verify-payment?' + params.toString())
    .then(function (r) { return r.json(); })
    .then(function (data) { show(!!(data && data.ok), orderId); })
    .catch(function () {
      // אם האימות בשרת נכשל, נופלים לקוד התשובה של HYP שחזר בכתובת
      show(params.get('CCode') === '0', orderId);
    });
})();
</script>
  <script src="/assets/presence.js?v=20260915-presence-v1"></script>
</body>
</html>
